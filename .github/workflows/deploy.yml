name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blog
        run: pnpm docs:build
        env:
          GITHUB_PAGES_BASE: ${{ format('{0}/', steps.pages.outputs.base_path) }}
          BLOG_HOSTNAME: ${{ steps.pages.outputs.origin }}
          BLOG_GISCUS_REPO_ID: ${{ vars.BLOG_GISCUS_REPO_ID }}
          BLOG_GISCUS_CATEGORY_ID: ${{ vars.BLOG_GISCUS_CATEGORY_ID }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/.vuepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
