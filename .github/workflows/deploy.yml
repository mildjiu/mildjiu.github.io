name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check behavior when uploaded images move
        run: node --test tests/blog-media.test.mjs

      - name: Build blog
        run: pnpm docs:build
        env:
          GITHUB_PAGES_BASE: ${{ format('{0}/', steps.pages.outputs.base_path) }}
          BLOG_HOSTNAME: ${{ steps.pages.outputs.origin }}
          BLOG_GISCUS_REPO_ID: ${{ vars.BLOG_GISCUS_REPO_ID }}
          BLOG_GISCUS_CATEGORY_ID: ${{ vars.BLOG_GISCUS_CATEGORY_ID }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/.vuepress/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public homepage uses this release
        env:
          BLOG_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          expected="<meta name=\"blog-revision\" content=\"$GITHUB_SHA\">"
          for attempt in {1..10}; do
            if html=$(curl -fsS --connect-timeout 5 --max-time 10 --get \
              --data-urlencode "revision=$GITHUB_SHA" \
              --data-urlencode "check=$attempt" "${BLOG_URL%/}/") &&
              grep -Fq "$expected" <<< "$html"; then
              echo "The public homepage is serving $GITHUB_SHA."
              exit 0
            fi
            sleep 8
          done
          echo "::error::无法确认公开首页已更新到本次发布，请查看发布记录。"
          exit 1
